    // বাংলা সংখ্যাকে ইংরেজি সংখ্যায় রূপান্তর
    function toEnglishDigits(str) {
      const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      return str.replace(/[০-৯]/g, d => bn.indexOf(d));
    }

    // সঠিক বাংলাদেশি মোবাইল নম্বর যাচাই (013-019 দিয়ে শুরু ১১ ডিজিট)
    function normalizeAndValidatePhone(input) {
      let cleaned = toEnglishDigits(input.trim()).replace(/[^0-9]/g, '');
      if (cleaned.startsWith('8801') && cleaned.length === 13) {
        cleaned = '0' + cleaned.slice(3);
      }
      const bdPhoneRegex = /^01[3-9]\d{8}$/;
      return {
        isValid: bdPhoneRegex.test(cleaned),
        phone: cleaned
      };
    }

    function showWarning(msg, focusEl = null) {
      const box = document.getElementById("formWarning");
      document.getElementById("formWarningText").textContent = msg;
      box.classList.add("show");
      box.scrollIntoView({ behavior: "smooth", block: "nearest" });
      if (focusEl) focusEl.focus();
    }

    function hideWarning() {
      document.getElementById("formWarning").classList.remove("show");
      document.getElementById("custPhone").classList.remove("input-error");
    }

    function updateOrderSummary() {
      const unitPrice = Number(activeProduct?.price || 218);
      const qty = Math.max(1, parseInt(document.getElementById("custQty").value) || 1);
      const subtotal = unitPrice * qty;
      const total = subtotal + currentDeliveryCharge;

      document.getElementById("summarySubtotal").textContent = `৳ ${subtotal}`;
      document.getElementById("summaryDelivery").textContent = currentDeliveryZone
        ? `${currentDeliveryZone} (৳ ${currentDeliveryCharge})`
        : "জেলা সিলেক্ট করুন";
      document.getElementById("summaryTotal").textContent = `৳ ${total}`;
    }

    // জেলা পরিবর্তনের সাথে সাথে অটোমেটিক ঢাকার ভিতরে/বাইরে সেট হবে
    document.getElementById("custDistrict").addEventListener("change", (e) => {
      const district = e.target.value;
      const insideRadio = document.getElementById("zoneInside");
      const outsideRadio = document.getElementById("zoneOutside");
      const insideBox = document.getElementById("zoneInsideBox");
      const outsideBox = document.getElementById("zoneOutsideBox");

      insideBox.classList.remove("selected");
      outsideBox.classList.remove("selected");
      insideRadio.checked = false;
      outsideRadio.checked = false;

      if (!district) {
        currentDeliveryZone = "";
        currentDeliveryCharge = 0;
      } else if (district === "Dhaka") {
        currentDeliveryZone = "ঢাকার ভিতরে";
        currentDeliveryCharge = INSIDE_DHAKA_CHARGE;
        insideRadio.checked = true;
        insideBox.classList.add("selected");
      } else {
        currentDeliveryZone = "ঢাকার বাইরে";
        currentDeliveryCharge = OUTSIDE_DHAKA_CHARGE;
        outsideRadio.checked = true;
        outsideBox.classList.add("selected");
      }

      hideWarning();
      updateOrderSummary();
    });

    document.getElementById("custQty").addEventListener("input", updateOrderSummary);
    document.getElementById("custPhone").addEventListener("input", () => {
      document.getElementById("custPhone").classList.remove("input-error");
      hideWarning();
    });

    async function fetchProduct() {
      const dbRef = ref(db);
      try {
        if (productId) {
          const snapshot = await get(child(dbRef, `products/${productId}`));
          if (snapshot.exists()) {
            activeProduct = { id: productId, ...snapshot.val() };
            renderProduct(activeProduct);
            return;
          }
        }
        const snapshot = await get(child(dbRef, "products"));
        if (snapshot.exists()) {
          const data = snapshot.val();
          const firstKey = Object.keys(data)[0];
          activeProduct = { id: firstKey, ...data[firstKey] };
          renderProduct(activeProduct);
        } else {
          document.getElementById("loading").innerHTML = "No Product Found";
        }
      } catch (err) {
        document.getElementById("loading").innerHTML = "Error loading product";
      }
    }

    function renderProduct(p) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("productCard").style.display = "block";
      document.getElementById("productImage").src = p.imageUrl || "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600";
      document.getElementById("productTitle").textContent = p.name || "Exclusive Jewellery Collection";
      document.getElementById("productDesc").textContent = p.description || "১০০% প্রিমিয়াম কোয়ালিটি তাজ জুয়েলারি কালেকশন। সারা দেশে হোম ডেলিভারি।";
      document.getElementById("productPrice").textContent = `৳ ${p.price || 218}`;
      updateOrderSummary();

      // Meta Pixel: ViewContent ইভেন্ট
      if (typeof fbq === "function") {
        fbq("track", "ViewContent", {
          content_ids: [String(p.id || "product")],
          content_name: p.name || "Exclusive Jewellery Collection",
          content_type: "product",
          value: Number(p.price || 218),
          currency: "BDT"
        });
      }
    }

    fetchProduct();

    const orderModal = document.getElementById("orderModal");
    document.getElementById("openOrderModal").addEventListener("click", () => {
      hideWarning();
      orderModal.classList.add("active");

      // Meta Pixel: InitiateCheckout ইভেন্ট
      if (typeof fbq === "function" && activeProduct) {
        fbq("track", "InitiateCheckout", {
          content_ids: [String(activeProduct.id || "product")],
          content_name: activeProduct.name || "Exclusive Jewellery Collection",
          content_type: "product",
          value: Number(activeProduct.price || 218),
          currency: "BDT",
          num_items: 1
        });
      }
    });

    document.getElementById("closeOrderModal").addEventListener("click", () => orderModal.classList.remove("active"));

    // FORM SUBMIT — ডেটাবেজে সেভ হলেই Purchase ইভেন্ট ফায়ার হবে
    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideWarning();

      const name = document.getElementById("custName").value.trim();
      const phoneInput = document.getElementById("custPhone");
      const districtEl = document.getElementById("custDistrict");
      const district = districtEl.value;
      const address = document.getElementById("custAddress").value.trim();
      const qty = Math.max(1, parseInt(document.getElementById("custQty").value) || 1);

      if (!name) {
        showWarning("সতর্কতা: অনুগ্রহ করে আপনার সম্পূর্ণ নাম লিখুন!", document.getElementById("custName"));
        return;
      }

      // ফোন নম্বর ভ্যালিডেশন
      const phoneCheck = normalizeAndValidatePhone(phoneInput.value);
      if (!phoneCheck.isValid) {
        phoneInput.classList.add("input-error");
        showWarning("সতর্কতা: সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর না দিলে অর্ডার কনফার্ম হবে না! (যেমন: 017XXXXXXXX)", phoneInput);
        return;
      }

      if (!district) {
        showWarning("সতর্কতা: অনুগ্রহ করে আপনার জেলা নির্বাচন করুন!", districtEl);
        return;
      }

      if (!address) {
        showWarning("সতর্কতা: অনুগ্রহ করে ডেলিভারির সম্পূর্ণ ঠিকানা লিখুন!", document.getElementById("custAddress"));
        return;
      }

      const btn = document.getElementById("submitOrderBtn");
      btn.disabled = true;
      btn.textContent = "অর্ডার প্রসেসিং হচ্ছে...";

      const unitPrice = Number(activeProduct?.price || 218);
      const subtotal = unitPrice * qty;
      const total = subtotal + currentDeliveryCharge;

      const orderData = {
        customerName: name,
        customerPhone: phoneCheck.phone,
        customerAddress: `${address}, জেলা: ${district} (${currentDeliveryZone})`,
        district: district,
        deliveryZone: currentDeliveryZone,
        deliveryCharge: currentDeliveryCharge,
        subtotal: subtotal,
        totalAmount: total,
        dueAmount: total,
        quantity: qty,
        unitPrice: unitPrice,
        productId: activeProduct?.id || "",
        productName: activeProduct?.name || "Exclusive Jewellery",
        status: "Processing",
        paymentType: "Cash on Delivery",
        createdAt: Date.now()
      };

      try {
        const ordersRef = ref(db, "orders");
        const newRef = push(ordersRef);
        await set(newRef, orderData);

        // ডেটাবেজে সঠিকভাবে সেভ হওয়ার পরেই কেবল Meta Pixel Purchase ফায়ার হবে
        if (typeof fbq === "function") {
          fbq("track", "Purchase", {
            content_ids: [String(orderData.productId || "product")],
            content_name: orderData.productName,
            content_type: "product",
            value: Number(orderData.totalAmount),
            currency: "BDT",
            num_items: Number(orderData.quantity)
          }, { eventID: newRef.key });
        }

        orderModal.innerHTML = `
          <div class="modal-box" style="text-align: center;">
            <i class="fas fa-check-circle" style="font-size: 50px; color: #25d366; margin-bottom: 15px;"></i>
            <h2 style="color: #ffd700;">ধন্যবাদ! অর্ডার সফল হয়েছে</h2>
            <p style="margin: 12px 0 8px; color: #e2e8f0; font-size: 14.5px;">
              মোট বিল: <strong style="color:#ffd700;">৳ ${total}</strong> (${currentDeliveryZone})
            </p>
            <p style="margin: 0 0 20px; color: #cbd5e1; font-size: 14px;">আমাদের প্রতিনিধি কিছুক্ষণের মধ্যেই কল দিয়ে অর্ডার নিশ্চিত করবেন।</p>
            <button class="order-btn" onclick="window.location.reload()">ঠিক আছে</button>
          </div>
        `;
      } catch (err) {
        showWarning("অর্ডার ডেটাবেজে সেভ হয়নি: " + err.message);
        btn.disabled = false;
        btn.textContent = "অর্ডার কনফার্ম করুন";
      }
    });
  </script>
</body>
</html>
